name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, sai-ci]
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/python-env"
          echo "$RUNNER_TEMP/python-env/bin" >> "$GITHUB_PATH"
      - name: Install native test runtimes
        run: sudo apt-get update && sudo apt-get install --yes liblua5.4-0 tcl
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev,tui]'
      - name: Test
        run: python -m pytest
      - name: Build
        run: python -m build
      - name: Public-surface scan
        run: |
          python scripts/check_public_surface.py
          python scripts/sync_native_slurm.py --check
