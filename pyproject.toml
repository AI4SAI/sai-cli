[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-cli"
version = "0.2.0a1"
description = "SAI command-line interface for people and agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
  { name = "AI4SAI contributors" },
]
keywords = ["hpc", "slurm", "sai", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AI4SAI/sai-cli"
Issues = "https://github.com/AI4SAI/sai-cli/issues"

[project.optional-dependencies]
tui = ["textual==8.2.8", "rich==15.0.0"]
dev = [
  "build>=1.2,<2",
  "packaging>=24",
  "pytest>=8,<9",
  "setuptools>=77",
]

[project.scripts]
sai = "sai_cli.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["sai_native_slurm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sai_cli = ["skills/sai-cli/SKILL.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
